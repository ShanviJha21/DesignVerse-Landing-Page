<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DesignVerse — Student Design & Innovation Fest</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React & React DOM CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Compiler for inline JSX rendering -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Lucide Vector Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    /* Custom Scrollbar Styling */
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #020617;
    }
    ::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #38bdf8;
    }
  </style>
</head>
<body class="bg-slate-950 text-white font-sans selection:bg-cyan-400 selection:text-slate-950 overflow-x-hidden">

  <!-- React Root Container -->
  <div id="root"></div>

  <!-- React JSX Application Script -->
  <script type="text/babel">
    const { useState, useEffect } = React;

    function App() {
      // Navigation & Scroll Tracking
      const [isNavOpen, setIsNavOpen] = useState(false);
      const [scrollY, setScrollY] = useState(0);
      const [scrollProgress, setScrollProgress] = useState(0);
      const [manualAtmosphere, setManualAtmosphere] = useState(null);

      // Registration Modal State
      const [isRegisterOpen, setIsRegisterOpen] = useState(false);
      const [formSubmitted, setFormSubmitted] = useState(false);
      const [ticketNumber, setTicketNumber] = useState('');
      const [formData, setFormData] = useState({
        fullName: '',
        email: '',
        college: '',
        competition: 'Website Design Sprint'
      });

      // Schedule Filter States
      const [scheduleDay, setScheduleDay] = useState(1);
      const [scheduleCategory, setScheduleCategory] = useState('All');
      const [activeFaq, setActiveFaq] = useState(null);

      // Countdown Timer
      const [timeLeft, setTimeLeft] = useState({ days: 28, hours: 14, minutes: 32, seconds: 45 });

      useEffect(() => {
        const timer = setInterval(() => {
          setTimeLeft(prev => {
            if (prev.seconds > 0) return { ...prev, seconds: prev.seconds - 1 };
            if (prev.minutes > 0) return { ...prev, minutes: 59, seconds: 59 };
            if (prev.hours > 0) return { ...prev, hours: prev.hours - 1, minutes: 59, seconds: 59 };
            if (prev.days > 0) return { ...prev, days: prev.days - 1, hours: 23, minutes: 59, seconds: 59 };
            return prev;
          });
        }, 1000);
        return () => clearInterval(timer);
      }, []);

      // Re-initialize Lucide Icons after DOM updates
      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      });

      // Scroll listener for atmosphere gradient
      useEffect(() => {
        const handleScroll = () => {
          const currentScroll = window.scrollY;
          setScrollY(currentScroll);
          const totalHeight = document.documentElement.scrollHeight - window.innerHeight;
          const progress = totalHeight > 0 ? Math.min(Math.max(currentScroll / totalHeight, 0), 1) : 0;
          setScrollProgress(progress);
        };

        window.addEventListener('scroll', handleScroll, { passive: true });
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      const handleFormChange = (e) => {
        setFormData({ ...formData, [e.target.name]: e.target.value });
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const randomTicket = 'DV-' + Math.floor(100000 + Math.random() * 900000);
        setTicketNumber(randomTicket);
        setFormSubmitted(true);
      };

      const getAtmosphereState = () => {
        if (manualAtmosphere) return manualAtmosphere;
        if (scrollProgress < 0.25) return 'day';
        if (scrollProgress < 0.55) return 'sunset';
        if (scrollProgress < 0.82) return 'night';
        return 'universe';
      };

      const currentAtmosphere = getAtmosphereState();

      const designCompetitions = [
        {
          id: "website-sprint",
          title: "Website Design Sprint",
          tag: "UI/UX Challenge",
          time: "Day 1 | 10:00 AM - 04:00 PM",
          venue: "Digital Atrium Lab A",
          prize: "₹50,000 + Cloud Grants",
          desc: "A 6-hour live UI/UX responsive challenge crafting next-generation immersive web portals with micro-interactions.",
          rules: "Individual or team of 2. Bring your own laptops and design software (Figma/React)."
        },
        {
          id: "poster-hack",
          title: "Poster Design Hack",
          tag: "Visual Communication",
          time: "Day 1 | 02:00 PM - 06:00 PM",
          venue: "Creative Studio B",
          prize: "₹30,000 + Subscriptions",
          desc: "High-impact visual communication & typography challenge communicating complex scientific concepts through striking poster art.",
          rules: "Open theme released on spot. Submissions evaluated on grid discipline and typography."
        },
        {
          id: "card-design",
          title: "Card Design Showcase",
          tag: "Digital & Tactile Craft",
          time: "Day 2 | 10:00 AM - 01:00 PM",
          venue: "Exhibition Hall 2",
          prize: "₹25,000 + Prototyping Kits",
          desc: "Crafting greeting and invitation cards that blend tactile paper artistry with modern digital AR triggers.",
          rules: "Physical and digital hybrid submission. Material samples provided on-site."
        },
        {
          id: "book-cover",
          title: "Book Cover Craft",
          tag: "Literary Redesign",
          time: "Day 2 | 11:30 AM - 03:30 PM",
          venue: "Design Atrium Hall C",
          prize: "₹35,000 + Feature",
          desc: "Redesigning iconic literary masterpieces with contemporary minimalist aesthetics, custom typography, and conceptual depth.",
          rules: "Choose from classic literary prompts. Focus on spine, front, and back jacket layout."
        },
        {
          id: "bookmark-art",
          title: "Bookmark Art Challenge",
          tag: "Micro-Layout",
          time: "Day 2 | 02:00 PM - 04:30 PM",
          venue: "Atrium Lounge",
          prize: "₹15,000 + Art Supplies",
          desc: "Micro-layout and intricate pattern design compressed within vertical constraint ratios to tell compelling visual stories.",
          rules: "Strict dimension constraints. Multi-layered vector or mixed media accepted."
        }
      ];

      const scheduleData = [
        { id: 1, day: 1, category: "Keynotes", time: "09:00 AM - 10:00 AM", title: "Opening Ceremony: Stepping into the Design Verse", speaker: "Dr. Elena Rostova", venue: "National Tech Main Stage" },
        { id: 2, day: 1, category: "Competitions", time: "10:00 AM - 04:00 PM", title: "Website Design Sprint (6-Hour Live UI/UX Challenge)", speaker: "Design Mentors", venue: "Digital Atrium Lab A" },
        { id: 3, day: 1, category: "Workshops", time: "02:00 PM - 04:00 PM", title: "AI-Human Symbiosis in Product Design Systems", speaker: "Aarav Sharma", venue: "Innovation Lab 3" },
        { id: 4, day: 1, category: "Competitions", time: "02:00 PM - 06:00 PM", title: "Poster Design Hack & Typography Masterclass", speaker: "Lucas Meyer", venue: "Creative Studio B" },
        { id: 5, day: 1, category: "Keynotes", time: "06:30 PM - 08:00 PM", title: "The Universe of Spatial Computing & Interfaces", speaker: "Maya Lin", venue: "National Tech Main Stage" },
        
        { id: 6, day: 2, category: "Competitions", time: "10:00 AM - 01:00 PM", title: "Card Design Showcase & Tactile Prototyping", speaker: "Jury Panel", venue: "Exhibition Hall 2" },
        { id: 7, day: 2, category: "Competitions", time: "11:30 AM - 03:30 PM", title: "Book Cover Craft: Literary Minimalist Redesign", speaker: "Editorial Leads", venue: "Design Atrium Hall C" },
        { id: 8, day: 2, category: "Competitions", time: "02:00 PM - 04:30 PM", title: "Bookmark Art Micro-Layout Challenge", speaker: "Craft Experts", venue: "Atrium Lounge" },
        { id: 9, day: 2, category: "Awards", time: "04:30 PM - 07:00 PM", title: "DesignVerse Grand Gala & Award Ceremony", speaker: "VIP Jury & Investors", venue: "National Tech Main Stage" }
      ];

      const filteredSchedule = scheduleData.filter(item => {
        const matchesDay = item.day === scheduleDay;
        const matchesCat = scheduleCategory === 'All' || item.category === scheduleCategory;
        return matchesDay && matchesCat;
      });

      const speakers = [
        {
          name: "Dr. Elena Rostova",
          role: "VP of Design Experience, Zenith",
          topic: "Stepping into the Design Verse",
          image: "https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&q=80&w=400",
          tag: "Opening Keynote"
        },
        {
          name: "Aarav Sharma",
          role: "AI Product Lead, PixelCraft",
          topic: "AI-Human Symbiosis in Systems",
          image: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=400",
          tag: "Workshop Lead"
        },
        {
          name: "Lucas Meyer",
          role: "Creative Technologist & Typographer",
          topic: "Generative Typography Systems",
          image: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=400",
          tag: "Keynote Speaker"
        },
        {
          name: "Maya Lin",
          role: "Spatial Computing Designer",
          topic: "Immersive AR/VR Prototyping",
          image: "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?auto=format&fit=crop&q=80&w=400",
          tag: "Masterclass Host"
        }
      ];

      const faqs = [
        { q: "Who can attend DesignVerse?", a: "DesignVerse is open to all university students, high school innovators, creative developers, and aspiring designers worldwide." },

        { q: "Can I participate in multiple competitions?", a: "Yes, provided their schedules do not overlap. Check the timings in the schedule section before registering." },

      ];

              style={{
                backgroundImage: `url('https://images.unsplash.com/photo-1513002749550-c59d786b8e6c?auto=format&fit=crop&q=80&w=2000')`,

            />

            {/* Layer 3: Night */}

              className="absolute inset-0 bg-cover bg-center transition-opacity duration-1000 ease-out"
              style={{
                backgroundImage: `url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&q=80&w=2000')`,
                opacity: currentAtmosphere === 'night' ? 1 : currentAtmosphere === 'sunset' ? 0.35 : currentAtmosphere === 'universe' ? 0.35 : 0
              }}
            />

            {/* Layer 4: Universe */}
            <div 
              className="absolute inset-0 bg-cover bg-center transition-opacity duration-1000 ease-out"
              style={{
                backgroundImage: `url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&q=80&w=2000')`,
                opacity: currentAtmosphere === 'universe' ? 1 : currentAtmosphere === 'night' ? 0.35 : 0
              }}
            />

            <div className="absolute inset-0 bg-gradient-to-b from-sky-950/30 via-slate-950/70 via-60% to-slate-950/95" />
          </div>

          {/* FLOATING ATMOSPHERE DEPTH CONTROLLER */}
          <div className="fixed right-4 top-1/2 -translate-y-1/2 z-50 hidden lg:flex flex-col items-center gap-3 p-2 rounded-2xl bg-slate-900/60 backdrop-blur-xl border border-white/20 shadow-2xl">
            <div className="text-[9px] font-bold uppercase tracking-widest text-cyan-300 -rotate-90 py-4">Sky Depth</div>
            {[
              { id: 'day', label: 'Day Sky' },
              { id: 'sunset', label: 'Sunset' },
              { id: 'night', label: 'Night' },
              { id: 'universe', label: 'Universe' }
            ].map((item) => (
              <button
                key={item.id}
                onClick={() => setManualAtmosphere(item.id)}
                title={item.label}
                className={`w-3.5 h-3.5 rounded-full transition-all ${
                  currentAtmosphere === item.id 
                    ? 'bg-cyan-400 scale-125 shadow-[0_0_12px_rgba(34,211,238,0.8)]' 
                    : 'bg-white/30 hover:bg-white/60'
                }`}
              />
            ))}
            {manualAtmosphere && (
              <button 
                onClick={() => setManualAtmosphere(null)}
                className="text-[8px] text-slate-300 underline mt-1 hover:text-white"
              >
                Auto
              </button>
            )}
          </div>

          {/* GLASS NAVBAR */}
          <header className={`fixed top-0 left-0 right-0 z-40 transition-all duration-300 ${scrollY > 30 ? 'py-3' : 'py-5'}`}>
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="rounded-2xl bg-white/10 backdrop-blur-2xl border border-white/20 px-6 py-3 flex items-center justify-between shadow-2xl">
                
                <a href="#" className="flex items-center gap-3 group">
                  <div className="w-9 h-9 rounded-xl bg-white/20 backdrop-blur-md border border-white/30 flex items-center justify-center shadow-inner group-hover:scale-105 transition">
                    <i data-lucide="sparkles" class="w-5 h-5 text-cyan-200"></i>
                  </div>
                  <span className="text-xl font-black tracking-tight text-white">
                    Design<span className="text-cyan-300">Verse</span>
                  </span>
                </a>

                <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-200">
                  <a href="#about" className="hover:text-white transition-colors">Overview</a>
                  <a href="#competitions" className="hover:text-white transition-colors">Competitions</a>
                  <a href="#schedule" className="hover:text-white transition-colors">Schedule</a>
                  <a href="#mentors" className="hover:text-white transition-colors">Mentors</a>
                  <a href="#faq" className="hover:text-white transition-colors">FAQ</a>
                </nav>

                <div className="hidden md:flex items-center gap-4">
                  <button 
                    onClick={() => setIsRegisterOpen(true)}
                    className="px-5 py-2.5 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-xs tracking-wider uppercase transition-all shadow-[0_0_20px_rgba(34,211,238,0.4)] active:scale-95 flex items-center gap-2"
                  >
                    <span>Register Pass</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                  </button>
                </div>

                <button 
                  onClick={() => setIsNavOpen(!isNavOpen)}
                  className="md:hidden p-2 rounded-xl bg-white/10 text-white border border-white/20"
                >
                  <i data-lucide={isNavOpen ? "x" : "menu"} class="w-5 h-5"></i>
                </button>
              </div>
            </div>

            {isNavOpen && (
              <div className="md:hidden max-w-7xl mx-auto px-4 mt-2">
                <div className="p-6 rounded-2xl bg-slate-950/90 backdrop-blur-2xl border border-white/20 space-y-4 shadow-2xl">
                  <a href="#about" onClick={() => setIsNavOpen(false)} className="block py-2 text-slate-200 font-medium">Overview</a>
                  <a href="#competitions" onClick={() => setIsNavOpen(false)} className="block py-2 text-slate-200 font-medium">Competitions</a>
                  <a href="#schedule" onClick={() => setIsNavOpen(false)} className="block py-2 text-slate-200 font-medium">Schedule</a>
                  <a href="#mentors" onClick={() => setIsNavOpen(false)} className="block py-2 text-slate-200 font-medium">Mentors</a>
                  <a href="#faq" onClick={() => setIsNavOpen(false)} className="block py-2 text-slate-200 font-medium">FAQ</a>
                  <button 
                    onClick={() => { setIsNavOpen(false); setIsRegisterOpen(true); }}
                    className="w-full py-3 rounded-xl bg-cyan-400 text-slate-950 font-bold text-sm shadow-lg"
                  >
                    Register Pass
                  </button>
                </div>
              </div>
            )}
          </header>

          {/* HERO SECTION WITH EXACT TAGLINE */}
          <section className="relative pt-36 pb-28 sm:pt-48 sm:pb-36 z-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
              
              <div className="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-white/15 backdrop-blur-md border border-white/30 text-xs sm:text-sm font-semibold tracking-wide text-white mb-8 shadow-lg">
                <span className="w-2 h-2 rounded-full bg-cyan-300 animate-ping"></span>
                <span>DesignVerse Student Fest 2026</span>
                <span className="text-white/40">•</span>
                <span className="text-cyan-200">November 15–16, 2026</span>
              </div>

              {/* Exact Tagline */}
              <h1 className="text-4xl sm:text-6xl md:text-7xl font-black tracking-tight text-white mb-6 leading-tight drop-shadow-lg">
                Unlimited imagination. <br />
                <span className="bg-clip-text text-transparent bg-gradient-to-r from-cyan-200 via-white to-purple-200">
                  Step into a verse of design
                </span>
              </h1>

              <p className="max-w-2xl mx-auto text-base sm:text-lg text-slate-100 font-normal mb-10 leading-relaxed drop-shadow">
                DesignVerse is a premier student design & innovation fest at the National Tech Innovation Center & Design Atrium, uniting visionary creators, spatial designers, and generative engineers.
              </p>

              <div className="flex flex-wrap items-center justify-center gap-3 text-xs sm:text-sm mb-12">
                <div className="px-4 py-2.5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center gap-2 shadow-sm">
                  <i data-lucide="calendar" class="w-4 h-4 text-cyan-300"></i>
                  <span>Nov 15–16, 2026</span>
                </div>
                <div className="px-4 py-2.5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center gap-2 shadow-sm">
                  <i data-lucide="clock" class="w-4 h-4 text-cyan-300"></i>
                  <span>9:00 AM IST Onwards</span>
                </div>
                <div className="px-4 py-2.5 rounded-2xl bg-white/10 backdrop-blur-md border border-white/20 text-white flex items-center gap-2 shadow-sm">
                  <i data-lucide="map-pin" class="w-4 h-4 text-cyan-300"></i>
                  <span>National Tech Innovation Center & Design Atrium</span>
                </div>
              </div>

              <div className="flex flex-col sm:flex-row items-center justify-center gap-4 max-w-md mx-auto mb-16">
                <button 
                  onClick={() => setIsRegisterOpen(true)}
                  className="w-full sm:w-auto px-8 py-4 rounded-2xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-sm tracking-wide shadow-[0_0_25px_rgba(34,211,238,0.4)] transition-all hover:scale-105 flex items-center justify-center gap-2"
                >
                  <span>Register Free Pass</span>

                </button>

                  href="#competitions"
                  className="w-full sm:w-auto px-8 py-4 rounded-2xl bg-white/10 hover:bg-white/20 backdrop-blur-md border border-white/25 text-white font-semibold text-sm transition-all"

                    <i data-lucide="award" class="w-6 h-6"></i>
                  </div>
                  <h3 className="text-xl font-bold text-white mb-2">Prizes & Grants</h3>
                  <p className="text-slate-300 text-xs sm:text-sm leading-relaxed">
                    Compete for a total prize pool of over ₹1.5 Lakhs in cash grants, software subscriptions, and publishing features.
                  </p>
                </div>
              </div>
            </div>
          </section>

          {/* REQUESTED DESIGN COMPETITIONS */}
          <section id="competitions" className="relative py-24 z-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="text-center max-w-2xl mx-auto mb-16">
                <span className="text-xs font-bold uppercase tracking-widest text-cyan-300">Competitions</span>
                <h2 className="text-3xl sm:text-5xl font-extrabold text-white mt-2">
                  Featured Design Competitions
                </h2>
                <p className="text-slate-300 text-xs sm:text-sm mt-3">
                  Enter our signature challenges designed to test your technical execution, aesthetic vision, and storytelling.
                </p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                {designCompetitions.map((comp) => (
                  <div 
                    key={comp.id}
                    className="p-8 rounded-3xl bg-slate-950/60 backdrop-blur-2xl border border-white/15 hover:border-cyan-400/50 transition-all shadow-2xl flex flex-col justify-between group"
                  >
                    <div>
                      <div className="flex items-center justify-between mb-6">
                        <div className="p-3 rounded-2xl bg-white/5 border border-white/10 group-hover:scale-110 transition text-cyan-300">
                          <i data-lucide="layout" class="w-5 h-5"></i>
                        </div>
                        <span className="text-[10px] font-bold uppercase tracking-wider px-3 py-1 rounded-full bg-white/10 text-cyan-200 border border-white/15">
                          {comp.tag}
                        </span>
                      </div>
                      
                      <div className="text-xs font-mono text-cyan-300 mb-1">{comp.time}</div>
                      <div className="text-xs text-slate-400 mb-3 flex items-center gap-1">
                        <i data-lucide="map-pin" class="w-3 h-3 text-purple-300"></i>
                        <span>{comp.venue}</span>
                      </div>

                      <h3 className="text-xl font-bold text-white mb-2">{comp.title}</h3>
                      <div className="text-xs font-semibold text-amber-300 mb-3">Prize Pool: {comp.prize}</div>
                      <p className="text-xs text-slate-300 leading-relaxed mb-4">{comp.desc}</p>
                      
                      <div className="p-3 rounded-xl bg-white/5 border border-white/10 text-[11px] text-slate-400 mb-6">
                        <span className="text-white font-medium">Rules:</span> {comp.rules}
                      </div>
                    </div>

                    <button 
                      onClick={() => {
                        setFormData(prev => ({ ...prev, competition: comp.title }));
                        setIsRegisterOpen(true);
                      }}
                      className="w-full py-3 rounded-xl bg-cyan-400/20 hover:bg-cyan-400 hover:text-slate-950 border border-cyan-400/40 text-xs font-bold text-cyan-300 flex items-center justify-center gap-2 transition"
                    >
                      <span>Enter Competition</span>
                      <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                    </button>
                  </div>
                ))}

                <div className="p-8 rounded-3xl bg-gradient-to-br from-cyan-900/40 to-purple-900/40 backdrop-blur-2xl border border-cyan-400/30 flex flex-col justify-between shadow-2xl">
                  <div>
                    <span className="text-[10px] font-bold uppercase tracking-wider px-3 py-1 rounded-full bg-cyan-400/20 text-cyan-200 border border-cyan-400/30">
                      All Access Pass
                    </span>
                    <h3 className="text-xl font-extrabold text-white mt-4 mb-2">Step into the Verse</h3>
                    <p className="text-xs text-slate-200 leading-relaxed mb-6">
                      Register now to secure your pass for all competitions, keynotes, and workshops at DesignVerse 2026.
                    </p>
                  </div>
                  <button 
                    onClick={() => setIsRegisterOpen(true)}
                    className="w-full py-3.5 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-bold text-xs tracking-wider uppercase transition shadow-lg flex items-center justify-center gap-2"
                  >
                    <span>Claim Free Pass</span>
                    <i data-lucide="arrow-right" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>

            </div>
          </section>

          {/* INTERACTIVE SCHEDULE SECTION */}
          <section id="schedule" className="relative py-24 z-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              
              <div className="text-center max-w-2xl mx-auto mb-12">
                <span className="text-xs font-bold uppercase tracking-widest text-cyan-300">Agenda</span>
                <h2 className="text-3xl sm:text-5xl font-extrabold text-white mt-2">
                  Interactive Schedule
                </h2>
              </div>

              <div className="flex flex-col sm:flex-row items-center justify-between gap-4 max-w-4xl mx-auto mb-10">
                <div className="flex p-1.5 rounded-2xl bg-slate-950/60 backdrop-blur-xl border border-white/15 w-full sm:w-auto">
                  <button
                    onClick={() => setScheduleDay(1)}
                    className={`flex-1 sm:flex-none px-6 py-2 rounded-xl text-xs font-bold transition ${
                      scheduleDay === 1 ? 'bg-cyan-400 text-slate-950 shadow-md' : 'text-slate-300 hover:text-white'
                    }`}
                  >
                    Day 1 (Nov 15)
                  </button>
                  <button
                    onClick={() => setScheduleDay(2)}
                    className={`flex-1 sm:flex-none px-6 py-2 rounded-xl text-xs font-bold transition ${
                      scheduleDay === 2 ? 'bg-cyan-400 text-slate-950 shadow-md' : 'text-slate-300 hover:text-white'
                    }`}
                  >
                    Day 2 (Nov 16)
                  </button>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  {['All', 'Keynotes', 'Competitions', 'Workshops', 'Awards'].map((cat) => (
                    <button
                      key={cat}
                      onClick={() => setScheduleCategory(cat)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-medium border transition ${
                        scheduleCategory === cat 
                          ? 'bg-white/20 border-white/40 text-white' 
                          : 'bg-slate-950/40 border-white/10 text-slate-400 hover:text-white'
                      }`}
                    >
                      {cat}
                    </button>
                  ))}
                </div>
              </div>

              <div className="max-w-4xl mx-auto space-y-4">
                {filteredSchedule.map((item) => (
                  <div 
                    key={item.id}
                    className="p-6 rounded-2xl bg-slate-950/60 backdrop-blur-xl border border-white/15 flex flex-col sm:flex-row sm:items-center justify-between gap-4 shadow-lg hover:border-cyan-400/40 transition"
                  >
                    <div className="flex items-start gap-4">
                      <div className="p-3 rounded-xl bg-cyan-400/10 border border-cyan-400/20 text-cyan-300 shrink-0">
                        <i data-lucide="clock" class="w-5 h-5"></i>
                      </div>
                      <div>
                        <div className="text-xs font-mono text-cyan-300 mb-1">{item.time}</div>
                        <h4 className="text-base font-bold text-white">{item.title}</h4>
                        <p className="text-xs text-slate-400 mt-1">
                          Lead: <span className="text-slate-200">{item.speaker}</span> • Venue: <span className="text-purple-300">{item.venue}</span>
                        </p>
                      </div>
                    </div>
                    <span className="self-start sm:self-center px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-wider bg-white/10 border border-white/15 text-slate-200">
                      {item.category}
                    </span>
                  </div>
                ))}
              </div>

            </div>
          </section>

          {/* SPEAKERS & MENTORS */}
          <section id="mentors" className="relative py-24 z-10">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center max-w-2xl mx-auto mb-16">
                <span className="text-xs font-bold uppercase tracking-widest text-indigo-300">Expertise</span>
                <h2 className="text-3xl sm:text-5xl font-extrabold text-white mt-2">
                  Featured Mentors & Speakers
                </h2>
              </div>

              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
                {speakers.map((sp, idx) => (
                  <div 
                    key={idx}
                    className="rounded-3xl bg-slate-950/60 backdrop-blur-xl border border-white/15 overflow-hidden hover:border-cyan-400/40 transition-all shadow-2xl group"
                  >
                    <div className="h-60 overflow-hidden relative">
                      <img 
                        src={sp.image} 
                        alt={sp.name} 
                        className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"
                      />
                      <div className="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/30 to-transparent" />
                      <span className="absolute top-3 right-3 px-2.5 py-1 rounded-full text-[10px] font-bold bg-slate-950/80 backdrop-blur-md text-cyan-300 border border-cyan-400/30">
                        {sp.tag}
                      </span>
                    </div>
                    <div className="p-6">
                      <h3 className="text-lg font-bold text-white">{sp.name}</h3>
                      <p className="text-xs text-purple-300 mb-3">{sp.role}</p>
                      <p className="text-xs text-slate-400 border-t border-white/10 pt-3">
                        <span className="text-slate-500">Topic:</span> {sp.topic}
                      </p>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* FAQ SECTION */}
          <section id="faq" className="relative py-20 z-10">
            <div className="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="text-center mb-12">
                <span className="text-xs font-bold uppercase tracking-widest text-cyan-300">Support</span>
                <h2 className="text-3xl sm:text-4xl font-extrabold text-white mt-2">
                  Frequently Asked Questions
                </h2>
              </div>

              <div className="space-y-3">
                {faqs.map((faq, idx) => (
                  <div 
                    key={idx}
                    className="rounded-2xl bg-slate-950/60 backdrop-blur-xl border border-white/15 overflow-hidden transition"
                  >
                    <button
                      onClick={() => setActiveFaq(activeFaq === idx ? null : idx)}
                      className="w-full p-5 text-left flex items-center justify-between text-sm sm:text-base font-semibold text-white hover:text-cyan-300 transition"
                    >
                      <span>{faq.q}</span>
                      <i data-lucide="chevron-down" class={`w-4 h-4 text-cyan-300 transition-transform ${activeFaq === idx ? 'rotate-180' : ''}`}></i>
                    </button>
                    {activeFaq === idx && (
                      <div className="px-5 pb-5 text-xs sm:text-sm text-slate-300 border-t border-white/5 pt-3 leading-relaxed">
                        {faq.a}
                      </div>
                    )}
                  </div>
                ))}
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="relative py-14 z-10 bg-slate-950/90 backdrop-blur-2xl border-t border-white/10 text-xs text-slate-400">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="grid grid-cols-1 md:grid-cols-4 gap-8 mb-8">
                <div className="space-y-3">
                  <span className="text-lg font-extrabold text-white">Design<span className="text-cyan-300">Verse</span></span>
                  <p className="text-slate-400 text-xs leading-relaxed">
                    Unlimited imagination. Step into a verse of design. Student Innovation Fest 2026.
                  </p>
                </div>

                <div>
                  <h4 className="font-bold text-white mb-3 uppercase tracking-wider text-[11px]">Event Navigation</h4>
                  <ul className="space-y-1.5">
                    <li><a href="#about" className="hover:text-white">Overview</a></li>
                    <li><a href="#competitions" className="hover:text-white">Competitions</a></li>
                    <li><a href="#schedule" className="hover:text-white">Schedule</a></li>
                    <li><a href="#mentors" className="hover:text-white">Mentors</a></li>
                  </ul>
                </div>

                <div>
                  <h4 className="font-bold text-white mb-3 uppercase tracking-wider text-[11px]">Venue & Time</h4>
                  <p className="leading-relaxed">
                    National Tech Innovation Center & Design Atrium<br />
                    Nov 15–16, 2026 | 9:00 AM IST Onwards
                  </p>
                </div>

                <div>
                  <h4 className="font-bold text-white mb-3 uppercase tracking-wider text-[11px]">Tech Stack (README)</h4>
                  <div className="flex flex-wrap gap-1.5">
                    <span className="px-2 py-1 rounded-md bg-white/5 border border-white/10 text-[10px]">React.js</span>
                    <span className="px-2 py-1 rounded-md bg-white/5 border border-white/10 text-[10px]">Tailwind CSS</span>
                    <span className="px-2 py-1 rounded-md bg-white/5 border border-white/10 text-[10px]">Lucide Icons</span>
                    <span className="px-2 py-1 rounded-md bg-white/5 border border-white/10 text-[10px]">HTML5 File</span>
                  </div>
                </div>
              </div>

              <div className="pt-6 border-t border-white/5 flex flex-col sm:flex-row items-center justify-between gap-4">
                <p>© 2026 DesignVerse Festival. All rights reserved.</p>
                <p className="text-slate-500">Unlimited imagination. Step into a verse of design.</p>
              </div>
            </div>
          </footer>

          {/* REGISTRATION MODAL WITH DIGITAL TICKET GENERATOR */}
          {isRegisterOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-xl">
              <div className="relative w-full max-w-lg rounded-3xl bg-slate-900/90 backdrop-blur-2xl border border-white/20 p-6 sm:p-8 shadow-2xl">
                
                <div className="flex items-center justify-between mb-6">
                  <div>
                    <h3 className="text-xl font-bold text-white">Register Student Pass</h3>
                    <p className="text-xs text-cyan-300 mt-1">DesignVerse Fest 2026 • 100% Free Entry</p>
                  </div>
                  <button 
                    onClick={() => setIsRegisterOpen(false)}
                    className="p-2 rounded-xl bg-white/5 text-slate-400 hover:text-white"
                  >
                    <i data-lucide="x" class="w-5 h-5"></i>
                  </button>
                </div>

                {formSubmitted ? (
                  <div className="text-center py-6 space-y-4">
                    <div className="w-16 h-16 rounded-full bg-cyan-400/20 border border-cyan-400 text-cyan-300 flex items-center justify-center mx-auto shadow-lg">
                      <i data-lucide="check" class="w-8 h-8"></i>
                    </div>
                    <h4 className="text-2xl font-bold text-white">Pass Generated Successfully!</h4>
                    <p className="text-xs text-slate-300">
                      Confirmation sent to <span className="text-cyan-300 font-medium">{formData.email}</span>
                    </p>

                    <div className="p-5 rounded-2xl bg-gradient-to-r from-slate-950 via-slate-900 to-slate-950 border border-cyan-400/30 text-left my-4 shadow-xl">
                      <div className="flex items-center justify-between mb-3">
                        <span className="text-xs font-bold text-cyan-300 uppercase tracking-widest">DesignVerse Pass</span>
                        <span className="text-xs font-mono bg-cyan-400/20 px-2 py-0.5 rounded text-cyan-200">{ticketNumber}</span>
                      </div>
                      <div className="text-sm font-bold text-white mb-1">{formData.fullName}</div>
                      <div className="text-xs text-slate-400 mb-3">{formData.college}</div>
                      <div className="text-[10px] text-purple-300 border-t border-white/10 pt-2">
                        Competition / Track: <span className="text-white">{formData.competition}</span>
                      </div>
                    </div>

                    <button
                      onClick={() => setIsRegisterOpen(false)}
                      className="w-full py-3 rounded-xl bg-cyan-400 text-slate-950 font-bold text-sm"
                    >
                      Close & Explore
                    </button>
                  </div>
                ) : (
                  <form onSubmit={handleFormSubmit} className="space-y-4 text-xs sm:text-sm">
                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Full Name</label>
                      <input 
                        type="text" 
                        required
                        name="fullName"
                        value={formData.fullName}
                        onChange={handleFormChange}
                        placeholder="Alex Morgan"
                        className="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-white/15 text-white focus:outline-none focus:border-cyan-400"
                      />
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-slate-300 font-medium mb-1">Student Email</label>
                        <input 
                          type="email" 
                          required
                          name="email"
                          value={formData.email}
                          onChange={handleFormChange}
                          placeholder="alex@university.edu"
                          className="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-white/15 text-white focus:outline-none focus:border-cyan-400"
                        />
                      </div>

                      <div>
                        <label className="block text-slate-300 font-medium mb-1">College / University</label>
                        <input 
                          type="text" 
                          required
                          name="college"
                          value={formData.college}
                          onChange={handleFormChange}
                          placeholder="National Tech Institute"
                          className="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-white/15 text-white focus:outline-none focus:border-cyan-400"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-300 font-medium mb-1">Select Competition / Track</label>
                      <select 
                        name="competition"
                        value={formData.competition}
                        onChange={handleFormChange}
                        className="w-full px-4 py-2.5 rounded-xl bg-slate-950/80 border border-white/15 text-white focus:outline-none focus:border-cyan-400"
                      >
                        <option value="Website Design Sprint">Website Design Sprint (6-Hour Live UI/UX Challenge)</option>
                        <option value="Poster Design Hack">Poster Design Hack (Visual Communication & Typography)</option>
                        <option value="Card Design Showcase">Card Design Showcase (Greeting & Invitation Craft)</option>
                        <option value="Book Cover Craft">Book Cover Craft (Literary Minimalist Redesign)</option>
                        <option value="Bookmark Art Challenge">Bookmark Art Challenge (Micro-Layout & Patterns)</option>
                        <option value="General Attendee Pass">General Attendee Pass (Keynotes & Workshops)</option>
                      </select>
                    </div>

                    <div className="pt-2">
                      <button 
                        type="submit"
                        className="w-full py-3.5 rounded-xl bg-cyan-400 hover:bg-cyan-300 text-slate-950 font-extrabold text-sm shadow-lg shadow-cyan-400/20"
                      >
                        Generate Free Student Pass
                      </button>
                    </div>
                  </form>
                )}

              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
